# Profil dev uniquement : ajoute un jeu de donnees de catalogue.
# Le seed vit dans un dossier SEPARE de db/migration pour qu'il ne parte
# JAMAIS en production, ou le catalogue est alimente par le vrai back-office.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Le seed porte un numero haut (V900). Quand tu ajouteras V3, V4... elles
# arriveront APRES lui dans l'ordre des versions : Flyway refuserait de les
# appliquer sans cette tolerance. Acceptable en dev, jamais en production.
spring.flyway.out-of-order=true

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
